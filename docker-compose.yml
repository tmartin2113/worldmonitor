# =============================================================================
# World Monitor — Docker / Podman Compose
# =============================================================================
# Self-contained stack: app + Redis + AIS relay.
#
# Quick start:
#   cp .env.example .env        # add your API keys
#   docker compose up -d --build
#
# The app will be available at http://localhost:3000
# =============================================================================

services:

  worldmonitor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle and sent as X-WorldMonitor-Key; must match
        # WORLDMONITOR_VALID_KEYS below (same .env value serves both sides).
        # NOTE: anyone who can load the dashboard can read this key out of the
        # bundle — acceptable for a tailnet-only instance, not for public exposure.
        VITE_SELF_HOST_API_KEY: "${WORLDMONITOR_VALID_KEYS:-}"
    image: worldmonitor:latest
    container_name: worldmonitor
    ports:
      # Bind loopback-only: the agent reaches worldmonitor via localhost; no LAN
      # exposure. (audit 2026-07-16 network-segmentation) Was "${WM_PORT:-3000}:8080".
      - "127.0.0.1:${WM_PORT:-3000}:8080"
    environment:
      UPSTASH_REDIS_REST_URL: "http://redis-rest:80"
      UPSTASH_REDIS_REST_TOKEN: "${REDIS_TOKEN:?REDIS_TOKEN required — generate with: openssl rand -hex 32}"
      # Signs the browser session cookie minted by /api/wm-session. Without it,
      # issueSessionToken() throws → 503, and every feed endpoint 401s for lack
      # of a session. Min 32 chars.
      WM_SESSION_SECRET: "${WM_SESSION_SECRET:?WM_SESSION_SECRET required — generate with: openssl rand -hex 32}"
      LOCAL_API_PORT: "46123"
      LOCAL_API_MODE: "docker"
      LOCAL_API_CLOUD_FALLBACK: "false"
      WS_RELAY_URL: "http://ais-relay:3004"
      # Must match the ais-relay service's RELAY_SHARED_SECRET — the app sends it
      # as the x-relay-key header when proxying feeds (opensky/polymarket/telegram)
      # through the relay; a mismatch or absence makes the relay 401 every proxy.
      RELAY_SHARED_SECRET: "${RELAY_SHARED_SECRET:?RELAY_SHARED_SECRET required — generate with: openssl rand -hex 32}"
      # LLM provider (any OpenAI-compatible endpoint)
      LLM_API_URL: "${LLM_API_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      # Self-host: server-side LLM → the HOST's Ollama, on CPU granite.
      # `ollama` is FIRST in PROVIDER_CHAIN (server/_shared/llm.ts) and needs no
      # API key, unlike the `generic` provider which returns null without
      # LLM_API_KEY. This is a BASE url — llm.ts appends /v1/chat/completions.
      # NOT taken from .env: the host-side OLLAMA_API_URL there is
      # http://localhost:11434 for the seeder scripts, and inside the container
      # localhost is the container. host.docker.internal is mapped to the docker
      # host by extra_hosts below and is in llm.ts's OLLAMA_HOST_ALLOWLIST.
      # CPU granite deliberately — keeps the GPU for IronClaw's 27B.
      # Raw docker0 gateway IP, NOT host.docker.internal: the API handlers run in
      # a Workers-style isolate whose fetch does not resolve the /etc/hosts entry
      # that extra_hosts adds, so the hostname form made llm-health's probe report
      # "Provider unreachable" while a plain node fetch in the same container
      # succeeded in 2ms. LOCAL_API_MODE=docker makes isLocalDeployment() true, so
      # the raw IP bypasses llm.ts's OLLAMA_HOST_ALLOWLIST hostname check.
      OLLAMA_API_URL: "http://172.17.0.1:11434"
      OLLAMA_MODEL: "${WM_BRIEF_LLM_MODEL:-mirofish-granite:latest}"
      # Self-host Pro unlock: a browser-held WORLDMONITOR_API_KEY that matches a value
      # here satisfies the SERVER-side premium gate. (Panels unlock client-side on any
      # 16+ char key entered in Settings; this makes server premium endpoints honor it.)
      WORLDMONITOR_VALID_KEYS: "${WORLDMONITOR_VALID_KEYS:-}"
      # Promote the per-API-key rate-limit layer from SHADOW to ENFORCE, so
      # enterprise-key callers are governed by ENTERPRISE_API_RATE_LIMIT
      # (1,000/min, per key hash) instead of the shared per-IP bucket. Paired
      # with the isEnterpriseAuth exemption in server/gateway.ts — without this
      # the key layer only records telemetry and traffic still falls through.
      API_RATE_LIMIT_ENFORCE: "true"
      # Self-host: the instance's own browser origin(s) so CORS/origin gates pass
      # (fixes the YouTube-live webcam resolver 403 on the tailnet MagicDNS origin).
      SELF_HOST_ORIGINS: "${SELF_HOST_ORIGINS:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      # Data source API keys (optional — features degrade gracefully)
      AISSTREAM_API_KEY: "${AISSTREAM_API_KEY:-}"
      FINNHUB_API_KEY: "${FINNHUB_API_KEY:-}"
      EIA_API_KEY: "${EIA_API_KEY:-}"
      FRED_API_KEY: "${FRED_API_KEY:-}"
      ACLED_EMAIL: "${ACLED_EMAIL:-}"
      ACLED_PASSWORD: "${ACLED_PASSWORD:-}"
      ACLED_ACCESS_TOKEN: "${ACLED_ACCESS_TOKEN:-}"
      NASA_FIRMS_API_KEY: "${NASA_FIRMS_API_KEY:-}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
      AVIATIONSTACK_API: "${AVIATIONSTACK_API:-}"
      TRAVELPAYOUTS_API_TOKEN: "${TRAVELPAYOUTS_API_TOKEN:-}"
    # Docker secrets (recommended for API keys — keeps them out of docker inspect).
    # Create secrets/ dir with one file per key, then uncomment below.
    # See SELF_HOSTING.md or docker-compose.override.yml for details.
    # secrets:
    #   - GROQ_API_KEY
    #   - AISSTREAM_API_KEY
    #   - FINNHUB_API_KEY
    #   - FRED_API_KEY
    #   - NASA_FIRMS_API_KEY
    #   - LLM_API_KEY
    # Maps host.docker.internal → the docker host, so the container can reach the
    # host's Ollama (see OLLAMA_API_URL above). Reaches it through the socat
    # bridge on the docker0 gateway, which allowlists the docker address space
    # (ollama-docker-bridge.service — see ~/tool-integrations/install-ollama-bridge.sh).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis-rest:
        condition: service_started
      ais-relay:
        condition: service_started
    restart: unless-stopped

  ais-relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    image: worldmonitor-ais-relay:latest
    container_name: worldmonitor-ais-relay
    environment:
      AISSTREAM_API_KEY: "${AISSTREAM_API_KEY:-}"
      # Shared secret the relay requires to boot and uses to authenticate proxied
      # requests (x-relay-key header). MUST match the value the worldmonitor app
      # sends. Without it the relay FATALs on startup.
      RELAY_SHARED_SECRET: "${RELAY_SHARED_SECRET:?RELAY_SHARED_SECRET required — generate with: openssl rand -hex 32}"
      UPSTASH_REDIS_REST_URL: "http://redis-rest:80"
      UPSTASH_REDIS_REST_TOKEN: "${REDIS_TOKEN:?REDIS_TOKEN required — generate with: openssl rand -hex 32}"
      UPSTASH_ALLOW_INSECURE_HTTP: "true"
      PORT: "3004"
    depends_on:
      redis-rest:
        condition: service_started
    restart: unless-stopped

  redis:
    image: docker.io/redis:7-alpine
    container_name: worldmonitor-redis
    # --requirepass closes off the network so any future sidecar / compromised
    # dependency added to the worldmonitor network can't read or write cache
    # entries without the password. Defense-in-depth alongside the REST token.
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD required — generate with: openssl rand -hex 32}"
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped

  redis-rest:
    build:
      context: docker
      dockerfile: Dockerfile.redis-rest
    image: worldmonitor-redis-rest:latest
    container_name: worldmonitor-redis-rest
    ports:
      - "127.0.0.1:8079:80"
    environment:
      SRH_TOKEN: "${REDIS_TOKEN:?REDIS_TOKEN required — generate with: openssl rand -hex 32}"
      # Defense-in-depth: the redis service's --requirepass already fails
      # compose validation if REDIS_PASSWORD is unset, but the explicit
      # :? here protects against a future PR removing --requirepass or
      # copying this connection string into a new service.
      SRH_CONNECTION_STRING: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required — generate with: openssl rand -hex 32}@redis:6379"
    depends_on:
      - redis
    restart: unless-stopped

# Docker secrets — uncomment and point to your secret files.
# Example: echo "gsk_abc123" > secrets/groq_api_key.txt
# secrets:
#   GROQ_API_KEY:
#     file: ./secrets/groq_api_key.txt
#   AISSTREAM_API_KEY:
#     file: ./secrets/aisstream_api_key.txt
#   FINNHUB_API_KEY:
#     file: ./secrets/finnhub_api_key.txt
#   FRED_API_KEY:
#     file: ./secrets/fred_api_key.txt
#   NASA_FIRMS_API_KEY:
#     file: ./secrets/nasa_firms_api_key.txt
#   LLM_API_KEY:
#     file: ./secrets/llm_api_key.txt

volumes:
  redis-data:
