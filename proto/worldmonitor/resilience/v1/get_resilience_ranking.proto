syntax = "proto3";

package worldmonitor.resilience.v1;

import "worldmonitor/resilience/v1/resilience.proto";
import "worldmonitor/core/v1/data_status.proto";

message GetResilienceRankingRequest {}

message GetResilienceRankingResponse {
  repeated ResilienceRankingItem items = 1;
  repeated ResilienceRankingItem greyed_out = 2;
  string fetched_at = 3;
  int32 scored = 4;
  int32 total = 5;
  double coverage = 6;
  bool partial = 7;
  // Why this payload looks the way it does. Distinguishes a genuinely empty
  // result from "never fetched" and from "the fetch failed" — states a bare
  // empty payload collapses into one unfalsifiable answer.
  worldmonitor.core.v1.DataStatus data_status = 8;
}
