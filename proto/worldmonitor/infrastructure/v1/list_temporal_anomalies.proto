syntax = "proto3";

package worldmonitor.infrastructure.v1;

import "worldmonitor/core/v1/data_status.proto";


message ListTemporalAnomaliesRequest {
}

message ListTemporalAnomaliesResponse {
  repeated TemporalAnomaly anomalies = 1;
  repeated string tracked_types = 2;
  string computed_at = 3;
  // Why this payload looks the way it does. Distinguishes a genuinely empty
  // result from "never fetched" and from "the fetch failed" — states a bare
  // empty payload collapses into one unfalsifiable answer.
  worldmonitor.core.v1.DataStatus data_status = 4;
}

message TemporalAnomaly {
  string type = 1;
  string region = 2;
  int32 current_count = 3;
  int32 expected_count = 4;
  double z_score = 5;
  string severity = 6;
  double multiplier = 7;
  string message = 8;
}
