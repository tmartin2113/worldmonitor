syntax = "proto3";

package worldmonitor.infrastructure.v1;

import "worldmonitor/core/v1/data_status.proto";


// GetIpGeoRequest defined for future parameters (e.g., specific IP).
message GetIpGeoRequest {}

// GetIpGeoResponse contains geographic information derived from the request IP.
message GetIpGeoResponse {
  // ISO 3166-1 alpha-2 country code.
  string country = 1;
  // Region or city (if available).
  string region = 2;
  string city = 3;
  // Why this payload looks the way it does. Distinguishes a genuinely empty
  // result from "never fetched" and from "the fetch failed" — states a bare
  // empty payload collapses into one unfalsifiable answer.
  worldmonitor.core.v1.DataStatus data_status = 4;
}
