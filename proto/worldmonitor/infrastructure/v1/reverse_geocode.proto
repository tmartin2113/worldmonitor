syntax = "proto3";

package worldmonitor.infrastructure.v1;

import "sebuf/http/annotations.proto";
import "worldmonitor/core/v1/data_status.proto";

// ReverseGeocodeRequest parameters for coordinate-to-address lookups.
message ReverseGeocodeRequest {
  // Latitude of the point to reverse geocode.
  double lat = 1 [(sebuf.http.query) = {name: "lat"}];
  // Longitude of the point to reverse geocode.
  double lon = 2 [(sebuf.http.query) = {name: "lon"}];
}

// ReverseGeocodeResponse containing the resolved location details.
message ReverseGeocodeResponse {
  // Human-readable country name.
  string country = 1;
  // ISO country code.
  string code = 2;
  // Full display name/address.
  string display_name = 3;
  // Optional error message.
  string error = 4;
  // Why this payload looks the way it does. Distinguishes a genuinely empty
  // result from "never fetched" and from "the fetch failed" — states a bare
  // empty payload collapses into one unfalsifiable answer.
  worldmonitor.core.v1.DataStatus data_status = 5;
}
