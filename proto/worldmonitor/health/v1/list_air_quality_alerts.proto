syntax = "proto3";

package worldmonitor.health.v1;

import "sebuf/http/annotations.proto";
import "worldmonitor/core/v1/data_status.proto";

message AirQualityAlert {
  string city = 1;
  string country_code = 2;
  double lat = 3;
  double lng = 4;
  double pm25 = 5;
  int32 aqi = 6;
  string risk_level = 7;
  string pollutant = 8;
  int64 measured_at = 9 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
  string source = 10;
}

message ListAirQualityAlertsRequest {}

message ListAirQualityAlertsResponse {
  repeated AirQualityAlert alerts = 1;
  int64 fetched_at = 2 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
  // Why this payload looks the way it does. Distinguishes a genuinely empty
  // result from "never fetched" and from "the fetch failed" — states a bare
  // empty payload collapses into one unfalsifiable answer.
  worldmonitor.core.v1.DataStatus data_status = 3;
}
