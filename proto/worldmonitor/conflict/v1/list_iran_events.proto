syntax = "proto3";

package worldmonitor.conflict.v1;

import "worldmonitor/core/v1/data_status.proto";

message ListIranEventsRequest {}

message IranEvent {
  string id = 1;
  string title = 2;
  string category = 3;
  string source_url = 4;
  double latitude = 5;
  double longitude = 6;
  string location_name = 7;
  int64 timestamp = 8;
  string severity = 9;
}

message ListIranEventsResponse {
  repeated IranEvent events = 1;
  int64 scraped_at = 2;
  // Why this payload looks the way it does. Distinguishes a genuinely empty
  // result from "never fetched" and from "the fetch failed" — states a bare
  // empty payload collapses into one unfalsifiable answer.
  worldmonitor.core.v1.DataStatus data_status = 3;
}
