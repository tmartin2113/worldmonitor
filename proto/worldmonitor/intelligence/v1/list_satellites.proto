syntax = "proto3";
package worldmonitor.intelligence.v1;

import "sebuf/http/annotations.proto";
import "worldmonitor/intelligence/v1/satellite.proto";
import "worldmonitor/core/v1/data_status.proto";

// ListSatellitesRequest specifies filters for orbital data.
message ListSatellitesRequest {
  // Filter by country code. Empty returns all.
  string country = 1 [(sebuf.http.query) = {name: "country"}];
}

// ListSatellitesResponse contains the current orbital snapshot.
message ListSatellitesResponse {
  // Collection of tracked satellites.
  repeated Satellite satellites = 1;
  // Why this payload looks the way it does. Distinguishes a genuinely empty
  // result from "never fetched" and from "the fetch failed" — states a bare
  // empty payload collapses into one unfalsifiable answer.
  worldmonitor.core.v1.DataStatus data_status = 2;
}
