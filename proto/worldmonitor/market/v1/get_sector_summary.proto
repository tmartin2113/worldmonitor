syntax = "proto3";

package worldmonitor.market.v1;

import "sebuf/http/annotations.proto";
import "worldmonitor/market/v1/market_quote.proto";
import "worldmonitor/core/v1/data_status.proto";

// GetSectorSummaryRequest specifies parameters for retrieving sector performance.
message GetSectorSummaryRequest {
  // Time period for performance calculation (e.g., "1d", "1w", "1m"). Defaults to "1d".
  // Accepted but currently ignored; no-op until this handler supports the parameter.
  string period = 1 [(sebuf.http.query) = { name: "period" }, (sebuf.http.unimplemented) = true];
}

// GetSectorSummaryResponse contains sector performance data.
message GetSectorSummaryResponse {
  // The list of sector performances.
  repeated SectorPerformance sectors = 1;
  // Why this payload looks the way it does. Distinguishes a genuinely empty
  // result from "never fetched" and from "the fetch failed" — states a bare
  // empty payload collapses into one unfalsifiable answer.
  worldmonitor.core.v1.DataStatus data_status = 2;
}
