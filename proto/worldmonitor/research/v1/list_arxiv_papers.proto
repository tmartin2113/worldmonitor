syntax = "proto3";

package worldmonitor.research.v1;

import "sebuf/http/annotations.proto";
import "worldmonitor/core/v1/pagination.proto";
import "worldmonitor/research/v1/research_item.proto";
import "worldmonitor/core/v1/data_status.proto";

// ListArxivPapersRequest specifies filters for retrieving arXiv papers.
message ListArxivPapersRequest {
  // Maximum items per page (1-100).
  int32 page_size = 1 [(sebuf.http.query) = { name: "page_size" }];
  // Cursor for next page.
  // Accepted but currently ignored; no-op until this handler supports the parameter.
  string cursor = 2 [(sebuf.http.query) = { name: "cursor" }, (sebuf.http.unimplemented) = true];
  // arXiv category filter (e.g., "cs.AI"). Empty returns all tracked categories.
  string category = 3 [(sebuf.http.query) = { name: "category" }];
  // Search query for paper titles and abstracts.
  // Accepted but currently ignored; no-op until this handler supports the parameter.
  string query = 4 [(sebuf.http.query) = { name: "query" }, (sebuf.http.unimplemented) = true];
}

// ListArxivPapersResponse contains arXiv papers matching the request.
message ListArxivPapersResponse {
  // The list of arXiv papers.
  repeated ArxivPaper papers = 1;
  // Pagination metadata.
  worldmonitor.core.v1.PaginationResponse pagination = 2;
  // Why this payload looks the way it does. Distinguishes a genuinely empty
  // result from "never fetched" and from "the fetch failed" — states a bare
  // empty payload collapses into one unfalsifiable answer.
  worldmonitor.core.v1.DataStatus data_status = 3;
}
