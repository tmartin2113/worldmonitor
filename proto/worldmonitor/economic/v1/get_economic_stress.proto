syntax = "proto3";

package worldmonitor.economic.v1;

import "sebuf/http/annotations.proto";
import "worldmonitor/core/v1/data_status.proto";

message EconomicStressComponent {
  string id = 1;
  string label = 2;
  double raw_value = 3;
  double score = 4;
  double weight = 5;
  bool missing = 6;
}

message GetEconomicStressRequest {}

message GetEconomicStressResponse {
  double composite_score = 1;
  string label = 2;
  repeated EconomicStressComponent components = 3;
  string seeded_at = 4;
  // True when the upstream or seed-backed variant is unavailable; empty payload fields
  // are graceful degradation, not confirmed zero data.
  bool unavailable = 5;
  // Why this payload looks the way it does. Distinguishes a genuinely empty
  // result from "never fetched" and from "the fetch failed" — states a bare
  // empty payload collapses into one unfalsifiable answer.
  worldmonitor.core.v1.DataStatus data_status = 6;
}
