syntax = "proto3";

package worldmonitor.economic.v1;

import "sebuf/http/annotations.proto";
import "worldmonitor/core/v1/data_status.proto";

message FaoFoodPricePoint {
  string date = 1;     // YYYY-MM
  double ffpi = 2;     // FAO Food Price Index (composite)
  double meat = 3;
  double dairy = 4;
  double cereals = 5;
  double oils = 6;
  double sugar = 7;
}

message GetFaoFoodPriceIndexRequest {}

message GetFaoFoodPriceIndexResponse {
  repeated FaoFoodPricePoint points = 1;  // last 12 months, ascending
  string fetched_at = 2;
  double current_ffpi = 3;
  double mom_pct = 4;   // month-over-month % change
  double yoy_pct = 5;   // year-over-year % change
  // Why this payload looks the way it does. Distinguishes a genuinely empty
  // result from "never fetched" and from "the fetch failed" — states a bare
  // empty payload collapses into one unfalsifiable answer.
  worldmonitor.core.v1.DataStatus data_status = 6;
}
